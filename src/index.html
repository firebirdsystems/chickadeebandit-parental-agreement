<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parental Agreement</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: var(--bg);
      --green: var(--hub-tint-success-fg, #16a34a); --green-light: var(--hub-tint-success, #dcfce7);
      --amber: var(--hub-tint-warning-fg, #d97706); --amber-light: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #dc2626);   --red-light: var(--hub-tint-danger, #fee2e2);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 600px; margin: 0 auto; padding: 16px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: var(--accent);
      border-radius: var(--radius);
      color: var(--accent-fg);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 2px; }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .tab-badge {
      background: var(--amber);
      color: white;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }

    /* ── Request cards ───────────────────────────────────── */
    .request-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s;
    }
    .request-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(3,105,161,.12); }
    .request-card.needs-action { border-color: var(--amber); background: var(--hub-tint-warning, #fffbeb); }

    .request-main { flex: 1; min-width: 0; }
    .request-title { font-weight: 600; font-size: 1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .request-who {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }
    .request-dates { font-size: 0.78rem; color: var(--muted); }

    .request-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .action-needed { font-size: 0.72rem; font-weight: 600; color: var(--amber); text-align: right; }

    /* ── Status badges ───────────────────────────────────── */
    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .status-pending   { background: var(--amber-light);  color: var(--amber); }
    .status-approved  { background: var(--green-light);  color: var(--green); }
    .status-rejected  { background: var(--red-light);    color: var(--red); }
    .status-cancelled { background: var(--border);       color: var(--muted); }

    /* ── Avatar ──────────────────────────────────────────── */
    .avatar {
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .avatar.sm { width: 24px; height: 24px; font-size: 0.7rem; }
    .avatar.xs { width: 18px; height: 18px; font-size: 0.62rem; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    @media (min-width: 480px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      max-height: 92vh;
      overflow-y: auto;
    }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }

    /* ── Form ────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      background: var(--card);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 72px; }
    .form-group .row { display: flex; gap: 10px; }
    .form-group .row > * { flex: 1; }

    .form-notice {
      background: var(--amber-light);
      color: var(--amber);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    /* ── Modal actions ───────────────────────────────────── */
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 100px; }

    /* ── Detail view ─────────────────────────────────────── */
    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .detail-header h3 { margin-bottom: 0; }
    .detail-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .detail-value { font-size: 0.92rem; font-weight: 500; }
    .member-inline { display: flex; align-items: center; gap: 6px; }
    .detail-section {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-bottom: 12px;
    }

    /* ── Approval note ───────────────────────────────────── */
    .approval-note-box {
      background: var(--green-light);
      border: 1px solid var(--green);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 4px;
      color: var(--hub-tint-success-fg, #14532d);
    }
    .approval-note-box.rejected {
      background: var(--red-light);
      border-color: var(--red);
      color: var(--hub-tint-danger-fg, #7f1d1d);
    }
    .approval-note-box .by { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    /* ── Misc ────────────────────────────────────────────── */
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .app-error, .form-error { margin: 12px 0; padding: 10px 14px; border-radius: 10px; background: var(--red-light); color: var(--red); font-size: 0.88rem; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .role-tag {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--border);
      color: var(--muted);
    }
    .role-tag.adult { background: var(--accent-light); color: var(--accent); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
  <base href="/run/parental-agreement/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm, searchMatch, glyph } from "/hub-sdk.js";
import { STATUS_INFO, formatDateTime, localToISO, isoToLocal, searchableFields, reviewsRequests, hasNoChildren } from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const APP_ID  = window.__APP_ID      ?? "parental-agreement";
const APPEND_RECORD = window.__APPEND_RECORD_URL ?? `/run/${APP_ID}/api/append-record`;
const ME      = window.__CURRENT_MEMBER ?? null;
// Reviewing other members' requests: any adult in a household, and only the
// steward in a shared space. The hub decides; this only keeps the page from
// offering a review it would refuse.
const REVIEWS = reviewsRequests(ME, { tenantKind: window.__TENANT_KIND ?? "household", isAdmin: window.__IS_ADMIN === true });

// ─── State ────────────────────────────────────────────────────────────────
let members   = [];
let memberMap = new Map();
let requests  = [];
let decisions = [];
let activeTab = "pending"; // adult: "pending" | "all" / child: "mine"
let searchQ = "";       // in-app search (see logic.js searchableFields)
let errorMsg = "";      // the last refusal or failure, shown above the list
let loadFailed = false; // the first load failed: banner instead of the list

// ─── DB helper ────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  // A refusal is an answer too: without this a write the hub turned down read
  // as a success, and the page went on to show a change that was never made.
  if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "The request could not be saved");
  return json;
}

async function appendRecord(name, data) {
  const res = await fetch(`${APPEND_RECORD}/${encodeURIComponent(name)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "Append failed"), { status: res.status });
  return json;
}

// ─── DB init ──────────────────────────────────────────────────────────────
async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}

// ─── Load ─────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",   role: "adult" },
      { id: "demo-2", name: "Sam",    role: "adult" },
      { id: "demo-3", name: "Jordan", role: "child" },
      { id: "demo-4", name: "Casey",  role: "child" },
    ];
    memberMap = new Map(members.map(m => [m.id, m]));
    return;
  }
  // A failed read throws: it is a failed load, never a household of nobody.
  const res = await fetch(`${CONTEXT}?keys=family.members`);
  const data = await res.json().catch(() => null);
  if (!res.ok || data === null || typeof data !== "object" || Array.isArray(data)) throw new Error("Couldn’t reach the hub. Try again.");
  // A 200 that names the key in `$errors` is the hub saying it could not read it.
  if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
  members = data["family.members"] ?? [];
  memberMap = new Map(members.map(m => [m.id, m]));
}

// Effective approval status is DERIVED from the adult-only decisions table, not
// from the (child-writable) permissions row. A child can edit/cancel their own
// request but cannot forge approval. Only the latest decision made at/after the
// request's last edit counts, so any edit resets approval back to pending.
function deriveStatus(req) {
  if (req.status === "cancelled") {
    return { ...req, status: "cancelled", approved_by: null, approved_at: null, approval_note: "" };
  }
  const latest = decisions
    .filter(d => d.permission_id === req.id && d.decided_at >= req.updated_at)
    .sort((a, b) => (a.decided_at < b.decided_at ? 1 : -1))[0];
  if (latest) {
    return { ...req, status: latest.decision, approved_by: latest.decided_by, approved_at: latest.decided_at, approval_note: latest.note };
  }
  return { ...req, status: "pending", approved_by: null, approved_at: null, approval_note: "" };
}

function statusRank(s) { return s === "pending" ? 0 : s === "approved" ? 1 : 2; }

async function loadRequests() {
  if (!DB || !ME) return;
  // An adult who takes part in a shared space without stewarding it files no
  // requests and may read nobody else's, so there is nothing to ask for.
  if (isAdult(ME) && !REVIEWS) return;

  const permSql = REVIEWS
    ? [`SELECT * FROM app_parental_agreement__permissions WHERE status != 'cancelled'`, []]
    : [`SELECT * FROM app_parental_agreement__permissions WHERE child_id = ?`, [ME.id]];

  // Decisions are scoped to the ones deriveStatus() can actually use: those
  // attached to a permission this viewer may read, made at or after that
  // request's last edit. Every other decision row — one per superseded
  // approval, and a request re-edited five times leaves five behind — was being
  // downloaded and decrypted on every launch to be filtered straight back out.
  //
  // One statement serves both personas because the rewriter applies each
  // table's own policy to the join: an adult reads all, while a child gets
  // `p.child_id = ?` added to the ON clause AND `d.child_id = ?` to the WHERE.
  // A JOIN, not `permission_id IN (SELECT ...)`: the rewriter fails closed on a
  // governed table named only inside a subquery.
  //
  // NB this trims rows RETURNED, not rows READ — the plan still walks the
  // decisions table. Bounding the read itself needs a time window, which would
  // change which stale requests the Pending badge counts, so it is left alone.
  const [{ rows: permRows }, { rows: decRows }] = await Promise.all([
    db(permSql[0], permSql[1]),
    db(`SELECT d.* FROM app_parental_agreement__decisions d JOIN app_parental_agreement__permissions p ON p.id = d.permission_id AND d.decided_at >= p.updated_at`),
  ]);

  decisions = decRows ?? [];
  requests = (permRows ?? [])
    .map(deriveStatus)
    .sort((a, b) =>
      statusRank(a.status) !== statusRank(b.status)
        ? statusRank(a.status) - statusRank(b.status)
        : (a.from_datetime < b.from_datetime ? -1 : a.from_datetime > b.from_datetime ? 1 : 0));
}

// ─── Helpers ──────────────────────────────────────────────────────────────
function memberName(id) {
  return memberMap.get(id)?.name ?? "Unknown";
}
function mc(id) { return memberColor(id, members); }

function adults() {
  return members.filter(m => isAdult(m));
}

function statusHtml(status) {
  const { cls, label, glyph: glyphName } = STATUS_INFO[status] ?? STATUS_INFO.pending;
  return `<span class="status-badge ${cls}">${glyphName ? glyph(glyphName, { accent: "currentColor" }) + " " : ""}${label}</span>`;
}

// ─── Notifications ────────────────────────────────────────────────────────
async function notify(title, body) {
  await fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, body, url: `/run/${APP_ID}`, audience: "adults" }),
  }).catch(() => {});
}

async function publishEvent(type, subjectId, payload = {}) {
  await fetch(`/run/${APP_ID}/api/events`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

// ─── Activity log ─────────────────────────────────────────────────────────
async function logActivity(permissionId, action, detail = "") {
  await appendRecord("activity", { permission_id: permissionId, action, detail });
}

// ─── Actions ──────────────────────────────────────────────────────────────
async function createRequest(fields) {
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();
  await db(`INSERT INTO app_parental_agreement__permissions (
    id, child_id, title, description,
    from_datetime, to_datetime,
    status, created_at, updated_at
  ) VALUES (?, ?, ?, ?, ?, ?, 'pending', ?, ?)`, [
    id, ME.id, fields.title, fields.description,
    fields.from_datetime, fields.to_datetime,
    now, now,
  ]);

  requests = [{
    id, child_id: ME.id, title: fields.title, description: fields.description,
    from_datetime: fields.from_datetime, to_datetime: fields.to_datetime,
    status: "pending", created_at: now, updated_at: now,
    approved_by: null, approved_at: null, approval_note: "",
  }, ...requests];
  closeModal();
  render();

  Promise.all([
    logActivity(id, "created", `${ME.name} submitted a new permission request`),
    notify(`✋ ${ME.name} is requesting permission`, `"${fields.title}" — open Parental Agreement to review`),
    // No activity-feed write here or at the two sibling sites below. That POST
    // used "message_posted", which is not one of the hub's own ActivityType
    // values a caller may write (CALLER_ALLOWED_ACTIVITY_TYPES) — the near
    // neighbour, conversation_message_posted, means a Household message and is
    // wired to the bell's Messages section, which a permission request is not.
    // So the hub refused every call with a 403 and no household ever saw an
    // entry; a fetch does not reject on 4xx, so the .catch() hid it. It also
    // sent an `actor` the hub ignores, resolving that from the session instead.
    //
    // This app's own logActivity() is a different sink — it writes the request's
    // in-app audit trail — and is unaffected.
  ]).catch(() => {});
}

async function updateRequest(reqId, fields) {
  const now = new Date().toISOString();
  // The child owns and may edit/cancel their own pending request (owner_only,
  // member_can_update defaults true). Bumping updated_at supersedes any prior
  // approval decision, so the request reverts to pending and parents re-approve.
  const { changed } = await db(`UPDATE app_parental_agreement__permissions SET
    title = ?, description = ?,
    from_datetime = ?, to_datetime = ?,
    status = 'pending', updated_at = ?
    WHERE id = ? AND child_id = ? AND status != 'cancelled'`,
  [fields.title, fields.description, fields.from_datetime, fields.to_datetime, now, reqId, ME.id]);
  if (changed === 0) throw Object.assign(new Error("This request can no longer be changed."), { forUser: true });

  const idx = requests.findIndex(r => r.id === reqId);
  if (idx !== -1) requests[idx] = deriveStatus({
    ...requests[idx], title: fields.title, description: fields.description,
    from_datetime: fields.from_datetime, to_datetime: fields.to_datetime,
    status: "pending", updated_at: now,
  });
  closeModal();
  render();

  Promise.all([
    logActivity(reqId, "updated", `${ME.name} updated the request — re-approval required`),
    notify(`Permission request updated — re-approval required`, `${ME.name} updated "${fields.title}". Please review the changes and re-approve.`),
  ]).catch(() => {});
}

async function recordDecision(reqId, decision, note) {
  const req = requests.find(r => r.id === reqId);
  // Already decided or gone from the list: say so rather than leave the dialog
  // open with nothing on it.
  if (!req || req.status !== "pending") throw Object.assign(new Error("This request can no longer be decided."), { forUser: true });
  const now   = new Date().toISOString();
  // Adult-only append endpoint derives decided_by/decided_at and keeps direct
  // app SQL from mutating the decision trail.
  const result = await appendRecord("decisions", { permission_id: reqId, child_id: req.child_id, decision, note });

  decisions.push({ id: result.id, permission_id: reqId, child_id: req.child_id, decision, note, decided_by: ME.id, decided_at: result.created_at ?? now });
  const idx = requests.findIndex(r => r.id === reqId);
  if (idx !== -1) requests[idx] = deriveStatus(requests[idx]);
  return req;
}

// What follows a stored decision ("approved" | "rejected"): close the dialog,
// redraw, then the audit entry, the notification and the event. Also called
// when a decision whose answer was lost turns out to be stored.
function afterDecision(req, decision, note) {
  const approved = decision === "approved";
  closeModal();
  render();

  Promise.all([
    logActivity(req.id, decision, `${ME.name} ${decision} the request${note ? `: "${note}"` : ""}`),
    approved
      ? notify(`✅ Permission approved by ${ME.name}`, `"${req.title}" has been approved${note ? ` — Note: ${note}` : ""}`)
      : notify(`❌ Permission denied by ${ME.name}`, `"${req.title}" was not approved${note ? ` — Note: ${note}` : ""}`),
    publishEvent(`parental-agreement.${decision}`, req.id, { title: req.title, approver: ME.name, child_id: req.child_id }),
  ]).catch(() => {});
}

async function approveRequest(reqId, note) {
  const req = await recordDecision(reqId, "approved", note);
  if (!req) return;
  afterDecision(req, "approved", note);
}

async function rejectRequest(reqId, note) {
  const req = await recordDecision(reqId, "rejected", note);
  if (!req) return;
  afterDecision(req, "rejected", note);
}

async function cancelRequest(reqId) {
  if (!await hubConfirm({ message: "Cancel this permission request?", confirmLabel: "Cancel request" })) return;
  const req = requests.find(r => r.id === reqId);
  const now = new Date().toISOString();
  const { changed } = await db(`UPDATE app_parental_agreement__permissions SET status = 'cancelled', updated_at = ? WHERE id = ? AND child_id = ? AND status != 'cancelled'`,
    [now, reqId, ME.id]);
  if (changed === 0) throw Object.assign(new Error("This request can no longer be cancelled."), { forUser: true });

  const idx = requests.findIndex(r => r.id === reqId);
  if (idx !== -1) requests[idx] = { ...requests[idx], status: "cancelled", updated_at: now };
  closeModal();
  render();

  if (req) {
    Promise.all([
      logActivity(reqId, "cancelled", `${ME.name} cancelled the request`),
      notify(`Permission request cancelled`, `${ME.name} cancelled the request for "${req.title}"`),
    ]).catch(() => {});
  }
}

// ─── Modal ────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  // Starting something new retires the last failure.
  errorMsg = "";
  document.querySelector(".app-error")?.remove();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

// ─── New / edit form ──────────────────────────────────────────────────────
function openRequestForm(req = null) {
  const isEdit = !!req;

  openModal(`
    <h3>${isEdit ? "Edit Request" : "New Permission Request"}</h3>
    ${isEdit ? `<div class="form-notice">${glyph("warning")} Editing will clear the current approval — parents must re-approve.</div>` : ""}
    <div class="form-group">
      <label>What do you want to do?</label>
      <input id="f-title" type="text" value="${esc(req?.title ?? "")}"
        placeholder="Stay out after curfew, go to a concert…" data-autofocus />
    </div>
    <div class="form-group">
      <label>Details <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <textarea id="f-desc" rows="3"
        placeholder="Where are you going, who with, how are you getting there…">${esc(req?.description ?? "")}</textarea>
    </div>
    <div class="form-group">
      <label>From</label>
      <input id="f-from" type="datetime-local" value="${req ? isoToLocal(req.from_datetime) : ""}" />
    </div>
    <div class="form-group">
      <label>Until</label>
      <input id="f-to" type="datetime-local" value="${req ? isoToLocal(req.to_datetime) : ""}" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-req-id="${esc(req?.id ?? "")}" onclick="submitForm(this.dataset.reqId)">
        ${isEdit ? "Save Changes" : "Submit Request"}
      </button>
    </div>
  `);
}

window.submitForm = async function(existingId) {
  const title        = document.getElementById("f-title").value.trim();
  const description  = document.getElementById("f-desc").value.trim();
  const from_raw     = document.getElementById("f-from").value;
  const to_raw       = document.getElementById("f-to").value;

  if (!title)    { document.getElementById("f-title").focus(); return; }
  if (!from_raw) { document.getElementById("f-from").focus();  return; }
  if (!to_raw)   { document.getElementById("f-to").focus();    return; }

  const form = modalEl;
  const btn = form?.querySelector('.modal-actions .btn-primary');
  if (btn?.disabled) return;
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  form?.querySelector(".form-error")?.remove();

  const from_datetime = localToISO(from_raw);
  const to_datetime   = localToISO(to_raw);

  try {
    if (existingId) {
      await updateRequest(existingId, { title, description, from_datetime, to_datetime });
    } else {
      await createRequest({ title, description, from_datetime, to_datetime });
    }
  } catch (e) {
    console.error(e);
    // A request that can no longer be changed has nothing left to retry.
    if (e?.forUser) await showRefusal(e.message);
    else showFormError(form, "Couldn’t save the request — try again.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
};

// ─── Approve / reject modal ───────────────────────────────────────────────
function openDecisionModal(req, decision) {
  const isApprove = decision === "approve";
  openModal(`
    <h3>${isApprove ? `${glyph("tick")} Approve Request` : `${glyph("close")} Deny Request`}</h3>
    <div style="margin-bottom:14px">
      <div style="font-weight:600">${esc(req.title)}</div>
      <div style="font-size:.85rem;color:var(--muted);margin-top:3px">
        ${formatDateTime(req.from_datetime)} → ${formatDateTime(req.to_datetime)}
      </div>
    </div>
    <div class="form-group">
      <label>Note <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input id="d-note" type="text"
        placeholder="${isApprove ? "Be home by midnight, text when you arrive…" : "Reason for denying…"}"
        data-autofocus />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn ${isApprove ? "btn-success" : "btn-danger"}"
        data-req-id="${esc(req.id)}" data-decision="${esc(decision)}"
        onclick="submitDecision(this.dataset.reqId, this.dataset.decision)">
        ${isApprove ? "Approve" : "Deny"}
      </button>
    </div>
  `);
};

window.submitDecision = async function(reqId, decision) {
  const note = document.getElementById("d-note").value.trim();
  const form = modalEl;
  const btn = form?.querySelector('.modal-actions button:not(.btn-ghost)');
  if (btn?.disabled) return;
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  form?.querySelector(".form-error")?.remove();
  try {
    if (decision === "approve") await approveRequest(reqId, note);
    else                        await rejectRequest(reqId, note);
  } catch (e) {
    console.error(e);
    if (e?.forUser) await showRefusal(e.message);
    else if ([403, 404, 409].includes(e?.status)) {
      // The hub turned the decision down: read the requests again. One that was
      // cancelled meanwhile (a reviewer no longer reads it) has nothing to retry.
      await loadRequests().catch(err => console.error(err));
      const req = requests.find(r => r.id === reqId);
      if (!req || req.status === "cancelled") showError("This request was cancelled, so it can no longer be decided.");
      else showFormError(form, "Couldn’t record the decision — try again.");
    }
    else if (e?.status === undefined || (e.status >= 500 && e.status !== 507)) {
      // No answer from the hub at all, or it failed on its side: the decision
      // may have been stored and only its answer lost, and a retry would
      // append a second one. Read the
      // requests again; if this one now carries this member's decision, it is
      // done. A failed read leaves the list as it was, so the line below shows.
      await loadRequests().catch(err => console.error(err));
      const made = decision === "approve" ? "approved" : "rejected";
      const req = requests.find(r => r.id === reqId);
      if (req && req.status === made && req.approved_by === ME.id && (req.approval_note ?? "") === note) afterDecision(req, made, note);
      else showFormError(form, "Couldn’t record the decision — try again.");
    }
    else showFormError(form, "Couldn’t record the decision — try again.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
};

// ─── Detail modal ─────────────────────────────────────────────────────────
function openDetailModal(req) {
  const child       = memberMap.get(req.child_id);
  const approver    = req.approved_by ? memberMap.get(req.approved_by) : null;
  const isMyRequest = ME?.id === req.child_id;
  const canEdit     = req.status === "pending" && isMyRequest;
  const canDecide   = req.status === "pending" && REVIEWS;
  const canCancel   = req.status === "pending" && isMyRequest;

  const approvalBlock = (req.status === "approved" || req.status === "rejected") && req.approval_note
    ? `<div class="approval-note-box ${req.status === "rejected" ? "rejected" : ""}">
        <div>${esc(req.approval_note)}</div>
        <div class="by">— ${esc(approver?.name ?? "A parent")}, ${formatDateTime(req.approved_at)}</div>
       </div>`
    : req.status !== "pending" && req.status !== "cancelled"
      ? `<div class="approval-note-box ${req.status === "rejected" ? "rejected" : ""}">
          <div class="by">${req.status === "approved" ? "Approved" : "Denied"} by ${esc(approver?.name ?? "A parent")} on ${formatDateTime(req.approved_at)}</div>
         </div>`
      : "";

  openModal(`
    <div class="detail-header">
      <div>
        <h3>${esc(req.title)}</h3>
        <div style="margin-top:5px">${statusHtml(req.status)}</div>
      </div>
      ${canEdit ? `<button class="btn btn-ghost btn-sm" data-req-id="${esc(req.id)}" onclick="openEditForm(this.dataset.reqId)">Edit</button>` : ""}
    </div>

    ${req.description ? `<p class="detail-desc">${esc(req.description)}</p>` : ""}

    <div class="detail-grid">
      <div>
        <div class="detail-label">Requested by</div>
        <div class="detail-value member-inline">
          <div class="avatar sm" style="background:${mc(req.child_id)}">${initial(child?.name ?? "?")}</div>
          ${esc(child?.name ?? "?")}
        </div>
      </div>
      <div>
        <div class="detail-label">Submitted</div>
        <div class="detail-value" style="font-size:.85rem">${formatDateTime(req.created_at)}</div>
      </div>
      <div>
        <div class="detail-label">From</div>
        <div class="detail-value">${formatDateTime(req.from_datetime)}</div>
      </div>
      <div>
        <div class="detail-label">Until</div>
        <div class="detail-value">${formatDateTime(req.to_datetime)}</div>
      </div>
    </div>

    ${approvalBlock ? `<div class="detail-section">${approvalBlock}</div>` : ""}

    <div class="modal-actions">
      ${canDecide ? `
        <button class="btn btn-success" data-testid="approve-request" data-req-id="${esc(req.id)}" onclick="openDecisionModal_(this.dataset.reqId, 'approve')">${glyph("tick", { accent: "currentColor" })} Approve</button>
        <button class="btn btn-danger"  data-testid="deny-request" data-req-id="${esc(req.id)}" onclick="openDecisionModal_(this.dataset.reqId, 'reject')">${glyph("close", { accent: "currentColor" })} Deny</button>
      ` : ""}
      ${canCancel ? `<button class="btn btn-ghost btn-sm" data-req-id="${esc(req.id)}" onclick="cancelRequest(this.dataset.reqId)">Cancel Request</button>` : ""}
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
  `);
}

window.openEditForm = function(reqId) {
  const req = requests.find(r => r.id === reqId);
  closeModal();
  if (req) openRequestForm(req);
};

window.openDecisionModal_ = function(reqId, decision) {
  const req = requests.find(r => r.id === reqId);
  if (!req) return;
  closeModal();
  openDecisionModal(req, decision);
};

window.cancelRequest  = (reqId) => cancelRequest(reqId).catch(e => { console.error(e); return e?.forUser ? showRefusal(e.message) : showError("Couldn’t cancel the request — try again."); });
window.closeModal     = closeModal;

// ─── Render ───────────────────────────────────────────────────────────────
function renderCard(req) {
  const child       = memberMap.get(req.child_id);
  const needsAction = req.status === "pending" && REVIEWS;

  return `
    <div class="request-card ${needsAction ? "needs-action" : ""}" data-testid="request-card" data-req-id="${esc(req.id)}" onclick="openDetailModal_(this.dataset.reqId)">
      <div class="request-main">
        <div class="request-title">${esc(req.title)}</div>
        <div class="request-who">
          <div class="avatar xs" style="background:${mc(req.child_id)}">${initial(child?.name ?? "?")}</div>
          ${esc(child?.name ?? "?")}
        </div>
        <div class="request-dates">${formatDateTime(req.from_datetime)} → ${formatDateTime(req.to_datetime)}</div>
      </div>
      <div class="request-right">
        ${statusHtml(req.status)}
        ${needsAction ? `<div class="action-needed" data-testid="needs-approval">Needs approval</div>` : ""}
      </div>
    </div>
  `;
}

// render() rewrites the whole view, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");
  if (next) { next.focus(); next.setSelectionRange(caret, caret); }
});

function render() {
  if (!ME) {
    document.getElementById("root").innerHTML = `<div class="empty">Please log in to use Parental Agreement.</div>`;
    return;
  }
  if (loadFailed) {
    // Nothing was read: no "all caught up", and no form to file a request from.
    document.getElementById("root").innerHTML = `
      <header data-testid="app-header">
        <div>
          <h1>${glyph("raised-hand")} ${isAdult(ME) ? "Parental Agreement" : "Permissions"}</h1>
        </div>
      </header>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the requests.</span>
        <button type="button" class="load-error-retry" data-testid="load-retry" onclick="retryLoad()">Try again</button></div>`;
    return;
  }

  if (REVIEWS) {
    renderAdultView();
  } else if (isAdult(ME)) {
    renderParticipantView();
  } else {
    renderChildView();
  }
}

function errorHtml() {
  return errorMsg ? `<div class="app-error" role="alert">${esc(errorMsg)}</div>` : "";
}

// A failure closes whatever dialog raised it and is shown above the list, so
// it is still on screen once the dialog is gone.
function showError(message) {
  errorMsg = message || "Something went wrong. Please try again.";
  closeModal();
  render();
}

// The hub turned the write down because the request changed elsewhere: read
// the list again first, so the card on screen is the stored one.
async function showRefusal(message) {
  await loadRequests().catch(e => console.error(e));
  showError(message);
}

// A failed save from a dialog the user typed into: the dialog stays open as
// typed and says so itself. If that dialog is no longer the one on screen, the
// failure goes above the list instead.
function showFormError(form, message) {
  const actions = form && form === modalEl ? form.querySelector(".modal-actions") : null;
  if (!actions) { showError(message); return; }
  const el = document.createElement("div");
  el.className = "form-error";
  el.setAttribute("role", "alert");
  el.textContent = message;
  actions.before(el);
}

const NO_CHILDREN_NOTE = "Permission requests come from child members, and there are none here yet. Add a child member and they can ask for permission in this app.";

// An adult in a shared space who is not its steward: they file no requests,
// and the steward alone reviews them.
function renderParticipantView() {
  document.getElementById("root").innerHTML = `
    <header data-testid="app-header">
      <div>
        <h1>${glyph("raised-hand")} Parental Agreement</h1>
        <div class="sub">Permission requests from child members</div>
      </div>
    </header>
    ${errorHtml()}
    <div class="empty" data-testid="participant-note">${hasNoChildren(members)
      ? NO_CHILDREN_NOTE
      : "In a shared space, the steward reviews permission requests. Child members ask for permission here, and the steward answers."}</div>
  `;
}

function renderAdultView() {
  const pending  = requests.filter(r => r.status === "pending");
  const resolved = requests.filter(r => r.status !== "pending");

  const scoped = activeTab === "pending" ? pending : resolved;
  const list = searchQ ? scoped.filter(r => searchMatch(searchQ, searchableFields(r))) : scoped;
  const listHtml = list.length === 0
    ? (searchQ
      ? `<div class="empty">No requests match "${esc(searchQ)}".</div>`
      : `<div class="empty" data-testid="empty-state">${!requests.length && hasNoChildren(members) ? NO_CHILDREN_NOTE : activeTab === "pending" ? "No pending requests — all caught up." : "No resolved requests yet."}</div>`)
    : list.map(r => renderCard(r)).join("");

  document.getElementById("root").innerHTML = `
    <header data-testid="app-header">
      <div>
        <h1>${glyph("raised-hand")} Parental Agreement</h1>
        <div class="sub">Review permission requests from your kids</div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab ${activeTab === "pending" ? "active" : ""}" data-testid="tab-pending" onclick="setTab('pending')">
        Pending ${pending.length > 0 ? `<span class="tab-badge">${pending.length}</span>` : ""}
      </button>
      <button class="tab ${activeTab === "all" ? "active" : ""}" data-testid="tab-resolved" onclick="setTab('all')">
        Resolved
      </button>
    </div>

    ${errorHtml()}
    ${requests.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search requests…" aria-label="Search requests" value="${esc(searchQ)}" /></div>` : ""}
    <div>${listHtml}</div>
  `;
}

function renderChildView() {
  const scoped   = requests.filter(r => r.status !== "cancelled");
  const active   = searchQ ? scoped.filter(r => searchMatch(searchQ, searchableFields(r))) : scoped;
  const listHtml = active.length === 0
    ? (searchQ
      ? `<div class="empty">No requests match "${esc(searchQ)}".</div>`
      : `<div class="empty">You haven't submitted any requests yet. Tap + New Request to ask for permission.</div>`)
    : active.map(r => renderCard(r)).join("");

  document.getElementById("root").innerHTML = `
    <header>
      <div>
        <h1>${glyph("raised-hand")} Permissions</h1>
        <div class="sub">Ask for permission from your parents</div>
      </div>
      <button class="btn btn-ghost"
        style="background:rgba(255,255,255,.15);color:white;border-color:rgba(255,255,255,.3)"
        onclick="openNewRequest()">+ New Request</button>
    </header>

    ${errorHtml()}
    ${requests.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search requests…" aria-label="Search requests" value="${esc(searchQ)}" /></div>` : ""}
    <div>${listHtml}</div>
  `;
}

window.setTab = function(tab) { activeTab = tab; render(); };
window.openNewRequest = function() { openRequestForm(); };
window.openDetailModal_ = function(id) {
  const req = requests.find(r => r.id === id);
  if (req) openDetailModal(req);
};

// ─── Deep linking ─────────────────────────────────────────────────────────────
function handleDeepLink() {
  const requestId = new URLSearchParams(window.location.search).get("requestId");
  if (!requestId) return;
  const req = requests.find(r => r.id === requestId);
  if (req) openDetailModal(req);
}

// ─── Init ─────────────────────────────────────────────────────────────────
async function firstLoad() {
  let failed = false;
  await Promise.all([
    loadMembers().catch(() => { failed = true; }),
    (DB ? loadRequests() : Promise.resolve()).catch(() => { failed = true; }),
  ]);
  loadFailed = failed;
  render();
  if (!loadFailed) handleDeepLink(); // never open a detail over a failed load
}
window.retryLoad = firstLoad;
firstLoad();
</script>
</body>
</html>
